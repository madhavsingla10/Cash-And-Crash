<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Designs Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0f; color: #fff; overflow: hidden; }
  #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
  #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
  
  .car-info {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: rgba(10, 10, 20, 0.85); backdrop-filter: blur(10px);
    padding: 24px 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
    text-align: center; min-width: 320px; pointer-events: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  
  .car-name { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
  .car-desc { font-size: 14px; color: #aaa; line-height: 1.5; max-width: 400px; margin: 0 auto; }
  .car-specs { display: flex; gap: 20px; margin-top: 12px; justify-content: center; }
  .spec { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .spec span { color: #fff; font-weight: 600; }
  
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: white; width: 56px; height: 56px; border-radius: 50%;
    cursor: pointer; font-size: 24px; display: flex; align-items: center;
    justify-content: center; transition: all 0.3s; pointer-events: auto;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-50%) scale(1.1); }
  #prev-btn { left: 30px; }
  #next-btn { right: 30px; }
  
  .dots { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s; }
  .dot.active { background: #fff; transform: scale(1.3); }
  
  .header { position: absolute; top: 30px; left: 30px; pointer-events: auto; }
  .header h1 { font-size: 20px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }
  .header p { font-size: 12px; color: #666; margin-top: 4px; }
  
  .controls-hint { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #555; pointer-events: none; }
</style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="ui-layer">
    <div class="header">
      <h1>Car Designs</h1>
      <p>Interactive 3D Showcase</p>
    </div>
    
    <div class="dots" id="dots"></div>
    
    <button class="nav-btn" id="prev-btn">&#10094;</button>
    <button class="nav-btn" id="next-btn">&#10095;</button>
    
    <div class="car-info" id="car-info">
      <div class="car-name" id="car-name">Futuristic Hypercar</div>
      <div class="car-desc" id="car-desc">Sleek angular design with neon accents and active aerodynamics for high-speed stability.</div>
      <div class="car-specs">
        <div class="spec">Speed <span>S</span></div>
        <div class="spec">Handling <span>A</span></div>
        <div class="spec">Style <span>S+</span></div>
      </div>
    </div>
    
    <div class="controls-hint">Drag to rotate &bull; Scroll to zoom</div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 15, 35);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5, 3, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 4;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI / 2.1;
controls.target.set(0, 0.8, 0);

scene.add(new THREE.AmbientLight(0x404060, 1.5));
const keyLight = new THREE.DirectionalLight(0xffffff, 2);
keyLight.position.set(5, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8888ff, 0.5);
rimLight.position.set(-3, 3, -3);
scene.add(rimLight);

const groundGeo = new THREE.PlaneGeometry(50, 50);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.8, metalness: 0.2 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

const gridHelper = new THREE.GridHelper(20, 20, 0x222233, 0x111122);
gridHelper.position.y = 0;
scene.add(gridHelper);

const cars = [];
let currentIndex = 0;

function createFuturisticHypercar() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.2, metalness: 0.9 });
  
  const lower = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.4, 4.2), bodyMat);
  lower.position.y = 0.45; lower.castShadow = true; group.add(lower);
  
  const mid = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.25, 3.0), bodyMat);
  mid.position.set(0, 0.72, -0.1); mid.castShadow = true; group.add(mid);
  
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.35, 1.8), new THREE.MeshStandardMaterial({ color: 0x0a1525, roughness: 0.1, metalness: 0.9 }));
  cabin.position.set(0, 0.85, -0.3); group.add(cabin);
  
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.2, 4), bodyMat);
  nose.rotation.x = -Math.PI / 2; nose.rotation.z = Math.PI / 4; nose.position.set(0, 0.5, -2.5); group.add(nose);
  
  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.35), bodyMat);
  wing.position.set(0, 1.1, 1.9); group.add(wing);
  
  const strip = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 });
  const neon = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 3.8), strip);
  neon.position.set(0, 0.35, -0.1); group.add(neon);
  
  addWheels(group, 1.9, 4.1, 0.38, 0x00aaff);
  return group;
}

function createMonsterTruck() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.5, metalness: 0.3 });
  
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 4.8), bodyMat);
  chassis.position.y = 1.1; chassis.castShadow = true; group.add(chassis);
  
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.7, 2.4), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 }));
  cabin.position.set(0, 1.65, -0.1); cabin.castShadow = true; group.add(cabin);
  
  const cageMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
  const cage1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 2.4), cageMat); cage1.position.set(-0.9, 1.6, -0.1);
  const cage2 = cage1.clone(); cage2.position.x = 0.9;
  const cageTop = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.08, 2.4), cageMat); cageTop.position.set(0, 2.0, -0.1);
  group.add(cage1, cage2, cageTop);
  
  const bullbar = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.5, 0.4), new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.9 }));
  bullbar.position.set(0, 0.9, -2.5); group.add(bullbar);
  
  addWheels(group, 2.4, 4.6, 0.75, 0xffaa00);
  return group;
}

function createRetroMuscleCar() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xaa2222, roughness: 0.4, metalness: 0.5 });
  
  const lower = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.5, 4.5), bodyMat);
  lower.position.y = 0.55; lower.castShadow = true; group.add(lower);
  
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.15, 1.6), bodyMat);
  hood.position.set(0, 0.75, -1.3); group.add(hood);
  
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.45, 1.6), new THREE.MeshStandardMaterial({ color: 0x221111, roughness: 0.1, metalness: 0.9 }));
  cabin.position.set(0, 0.85, 0.0); cabin.castShadow = true; group.add(cabin);
  
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.2, 1.2), bodyMat);
  trunk.position.set(0, 0.75, 1.4); group.add(trunk);
  
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.08, 4.3), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }));
  stripe.position.set(0, 0.58, 0); group.add(stripe);
  
  const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.06, 0.35), bodyMat);
  spoilerWing.position.set(0, 1.1, 1.85); group.add(spoilerWing);
  
  addWheels(group, 2.0, 4.4, 0.4, 0xcccccc);
  return group;
}

function createCyberSedan() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.15, metalness: 0.95 });
  
  const lower = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.45, 4.3), bodyMat);
  lower.position.y = 0.5; lower.castShadow = true; group.add(lower);
  
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.4, 2.0), new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.1, metalness: 0.9 }));
  cabin.position.set(0, 0.85, -0.1); cabin.castShadow = true; group.add(cabin);
  
  const trim = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.2 });
  const trimL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 4.2), trim); trimL.position.set(-1.0, 0.52, 0);
  const trimR = trimL.clone(); trimR.position.x = 1.0;
  group.add(trimL, trimR);
  
  addWheels(group, 2.0, 4.2, 0.42, 0xdddddd);
  return group;
}

function createArmoredLimousine() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.3, metalness: 0.8 });
  
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 6.5), bodyMat);
  chassis.position.y = 0.7; chassis.castShadow = true; group.add(chassis);
  
  const cabinFront = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 1.6), new THREE.MeshStandardMaterial({ color: 0x0a1525, roughness: 0.1, metalness: 0.9 }));
  cabinFront.position.set(0, 1.15, -1.8); cabinFront.castShadow = true; group.add(cabinFront);
  
  const cabinRear = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 2.2), new THREE.MeshStandardMaterial({ color: 0x0a1525, roughness: 0.1, metalness: 0.9 }));
  cabinRear.position.set(0, 1.15, 0.3); cabinRear.castShadow = true; group.add(cabinRear);
  
  const divider = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.5, 0.15), bodyMat);
  divider.position.set(0, 1.0, -1.05); group.add(divider);
  
  addWheels(group, 2.2, 6.3, 0.42, 0xdddddd);
  return group;
}

function createRallyBaja() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.6, metalness: 0.2 });
  
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.5, 4.2), bodyMat);
  chassis.position.y = 0.55; chassis.castShadow = true; group.add(chassis);
  
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.45, 1.8), new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.1, metalness: 0.9 }));
  cabin.position.set(0, 0.9, -0.2); cabin.castShadow = true; group.add(cabin);
  
  const roofRack = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 2.0), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 }));
  roofRack.position.set(0, 1.25, -0.1); group.add(roofRack);
  
  const skidPlate = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.1, 3.5), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9 }));
  skidPlate.position.set(0, 0.35, -0.1); group.add(skidPlate);
  
  addWheels(group, 2.0, 4.2, 0.42, 0x888888);
  return group;
}

function addWheels(group, width, length, radius, rimColor) {
  const xOffsets = [-width * 0.48, width * 0.48];
  const zOffsets = [-length * 0.33, length * 0.33];
  
  for (let x of xOffsets) {
    for (let z of zOffsets) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.32, 12), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7 }));
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, radius, z);
      wheel.castShadow = true;
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.6, radius * 0.6, 0.34, 6), new THREE.MeshStandardMaterial({ color: rimColor, metalness: 0.8 }));
      wheel.add(rim);
      group.add(wheel);
    }
  }
}

const carData = [
  { name: 'Futuristic Hypercar', desc: 'Sleek angular design with neon accents and active aerodynamics for extreme high-speed stability.', speed: 'S', handling: 'A', style: 'S+', color: 0x00ffff },
  { name: 'Monster Truck', desc: 'Massive lifted stance with oversized wheels and roll cage protection for ultimate off-road domination.', speed: 'B', handling: 'C', style: 'A', color: 0xff4400 },
  { name: 'Retro Muscle Car', desc: 'Classic American proportions with a roaring V8, aggressive stance, and timeless curb appeal.', speed: 'A', handling: 'B', style: 'S', color: 0xff3333 },
  { name: 'Cyber Sedan', desc: 'Minimalist luxury meets autonomous tech. Polished chrome finish with advanced driver assistance.', speed: 'A', handling: 'S', style: 'A+', color: 0xcccccc },
  { name: 'Armored Limousine', desc: 'Stretched body with reinforced plating and bulletproof glass for secure executive transport.', speed: 'B', handling: 'B', style: 'A', color: 0x222222 },
  { name: 'Rally Baja', desc: 'Rugged off-road warrior with skid plate protection, roof rack, and a spare tire for desert racing.', speed: 'A', handling: 'S', style: 'B+', color: 0xffaa00 }
];

const creators = [createFuturisticHypercar, createMonsterTruck, createRetroMuscleCar, createCyberSedan, createArmoredLimousine, createRallyBaja];

creators.forEach((creator, i) => {
  const car = creator();
  car.visible = i === 0;
  car.position.y = 0;
  scene.add(car);
  cars.push(car);
});

function showCar(index) {
  cars[currentIndex].visible = false;
  currentIndex = (index + carData.length) % carData.length;
  cars[currentIndex].visible = true;
  
  const data = carData[currentIndex];
  document.getElementById('car-name').textContent = data.name;
  document.getElementById('car-desc').textContent = data.desc;
  document.querySelector('.car-specs').innerHTML = `
    <div class="spec">Speed <span>${data.speed}</span></div>
    <div class="spec">Handling <span>${data.handling}</span></div>
    <div class="spec">Style <span>${data.style}</span></div>
  `;
  
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentIndex));
  
  const accent = new THREE.Color(data.color);
  document.querySelector('.car-name').style.color = '#' + accent.getHexString();
}

const dotsContainer = document.getElementById('dots');
carData.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', () => showCar(i));
  dotsContainer.appendChild(dot);
});

document.getElementById('prev-btn').addEventListener('click', () => showCar(currentIndex - 1));
document.getElementById('next-btn').addEventListener('click', () => showCar(currentIndex + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') showCar(currentIndex - 1);
  if (e.key === 'ArrowRight') showCar(currentIndex + 1);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  
  if (cars[currentIndex]) {
    cars[currentIndex].rotation.y += 0.003;
  }
  
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
