<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏰 London City 3D Map Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f19;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Top Brand & Header */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 24px;
      border-radius: 16px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .top-bar h1 {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #00f0ff, #ff0077);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-family: 'Chakra Petch', sans-serif;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    /* Navigation & Landmark Teleport Dock */
    .landmark-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      max-width: 95vw;
      overflow-x: auto;
    }
    .landmark-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .landmark-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      color: #ffffff;
      transform: translateY(-2px);
    }
    .landmark-btn.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.35), rgba(255, 0, 119, 0.35));
      border-color: #00f0ff;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    /* Right Lighting & Controls Panel */
    .controls-panel {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      padding: 16px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .panel-title {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .time-selector {
      display: flex;
      gap: 8px;
    }
    .time-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .time-btn:hover {
      border-color: #ff0077;
    }
    .time-btn.active {
      background: #ff0077;
      color: #ffffff;
      border-color: #ff0077;
      box-shadow: 0 0 12px rgba(255, 0, 119, 0.5);
    }
    .action-btn {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      background: #00f0ff;
      color: #0b0f19;
    }
    .play-game-btn {
      background: linear-gradient(135deg, #00ffaa, #00b4d8);
      border: none;
      color: #05141e;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 255, 170, 0.4);
      transition: transform 0.2s ease;
    }
    .play-game-btn:hover {
      transform: scale(1.03);
    }

    /* Helper Instruction Overlay */
    .helper-hint {
      position: absolute;
      top: 90px;
      left: 24px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Header -->
  <div class="top-bar">
    <h1>LONDON CITY 3D</h1>
    <span class="badge">INTERACTIVE SHOWCASE</span>
  </div>

  <div class="helper-hint">
    🖱️ Left Click + Drag to Rotate Orbit | Scroll Wheel to Zoom
  </div>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <span class="panel-title">Lighting Atmosphere</span>
    <div class="time-selector">
      <button class="time-btn active" data-time="day">☀️ Day</button>
      <button class="time-btn" data-time="sunset">🌇 Sunset</button>
      <button class="time-btn" data-time="night">🌃 Cyber</button>
    </div>

    <span class="panel-title" style="margin-top: 4px;">Camera</span>
    <button class="action-btn" id="auto-rotate-btn">⏸️ PAUSE ROTATE</button>
    <a href="/" class="play-game-btn">🏎️ PLAY FULL GAME</a>
  </div>

  <!-- Landmark Dock -->
  <div class="landmark-dock">
    <button class="landmark-btn active" data-target="overview">🗺️ Full Overview</button>
    <button class="landmark-btn" data-target="towerBridge">🏰 Tower Bridge</button>
    <button class="landmark-btn" data-target="bigBen">🕰️ Big Ben & Parliament</button>
    <button class="landmark-btn" data-target="londonEye">🎡 London Eye</button>
    <button class="landmark-btn" data-target="theShard">🏢 The Shard</button>
    <button class="landmark-btn" data-target="theGherkin">🏙️ The Gherkin</button>
    <button class="landmark-btn" data-target="buckingham">👑 Buckingham Palace</button>
    <button class="landmark-btn" data-target="piccadilly">✨ Piccadilly Circus</button>
    <button class="landmark-btn" data-target="busesCabs">🚌 Red Buses & Cabs</button>
  </div>

  <script type="module" src="/src/london-showcase.ts"></script>
</body>
</html>
